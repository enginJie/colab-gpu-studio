name: Sync Upstream

'on':
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动同步
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/TizenryA/colab-gpu-studio.git || true
          git fetch upstream main
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "chore: sync upstream changes"
          git push origin main
